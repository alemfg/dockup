[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dockup"
version = "1.0.0"
description = "Automated database backup manager with Docker auto-discovery"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "yourorg", email = "ops@yourorg.com"}]
keywords = ["backup", "database", "docker", "postgres", "mysql", "mongodb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "docker>=7.1.0",
    "apscheduler>=3.10.4",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "boto3>=1.34.0",
    "paramiko>=3.4.0",
    "redis>=5.0.4",
    "tenacity>=8.4.1",
    "structlog>=24.2.0",
    "croniter>=2.0.5",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "black>=24.4.2",
    "pre-commit>=3.7.1",
    "faker>=25.8.0",
]

[project.scripts]
dockup = "dockup.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dockup*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=dockup --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]
